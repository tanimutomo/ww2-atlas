#   1 画素 ≈ 1km なので **10km 前後が下限**。北・南・東・西に分けて当て直しても
#   同じ 10km 前後なので、図法の当て方ではなく読み取りの限界。
#   軍・軍集団の記号（正面幅が 50〜150km ある）を置くには十分だが、
#   師団を語れる精度ではない。
