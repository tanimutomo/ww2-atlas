# 西方戦役（黄色作戦）1940。West Point アトラス 10 番（両軍の配置）から
# 「画素で」読み取った生の値。経緯度は georef の変換で出す。
#
# この図も両軍とも地面に置いてある。軍・軍集団だけを採った。
# 1 画素 ≈ 1.3km で読み取り誤差が 10km 前後あるので、軍団以下を語る精度は無い。
#
# ⚠ 仏第 1・第 2 軍集団は Wikidata に項目が無いので自前 id（unit-fr-…）。
# ⚠ **軍集団の箱は「その軍集団の受け持ち区域」に置いてある**のであって、
#   司令部の所在地ではない。B 軍集団の箱はエムス川の東（パーダーボルン付近）に
#   出るが、ボックの司令部はもっと西にあった。師団や軍の記号とは読み方が違う。

