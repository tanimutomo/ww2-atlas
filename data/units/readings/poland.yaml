# ポーランド侵攻 1939。West Point アトラス 04 番（両軍の配置・8 月 31 日）から
# 「画素で」読み取った生の値。経緯度は georef の変換で出す（npm run build:units）。
#
# この図は珍しく**両軍とも地面に置いてある**（ノルマンディーの 55 番のような
# 「海の上の編成表」が無い）。ただし連合国側の「GENERAL RESERVE」の箱だけは
# 吹き出しで、細い線が実際の集結地（ラドム〜キェルツェの袋）を指している。
# 箱ではなく袋のほうに置いた（プロシー軍）。
# ナレフ軍集団も同じで、文字は袋の外にあるので袋の中心に置いている。
#
# 軍・軍集団だけを採り、軍団（XIX・XXI など）は採っていない。
# この図の 1 画素は約 1km で、読み取り誤差がおよそ 10km ある。軍団を語る精度が無い。

- operation: poland
  event: Q150812           # ポーランド侵攻
  sheet: WWIIEurope04
  date: 1939-09-01
  until: 1939-09-17        # ソ連の侵攻で図が変わる日まで
  license: pd
  sources:
    - title: "West Point History of Warfare Atlas, WWII Europe 4: Poland 1939, Dispositions of Opposing Forces, 31 August 1939"
      url: https://dhc.westpoint.edu/atlases/
      note: 米陸軍士官学校 史学科。位置だけを読み取り、画像は複製していない
