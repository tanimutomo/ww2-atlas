# オーヴァーロード作戦。West Point アトラスから「画素で」読み取った生の値。
# 経緯度は data/units/georef/<sheet>.yaml の変換で出す（npm run build:units）。
#
# ⚠ 記号には 2 種類ある。
#   ① 地面に置いてあるもの ＝ その部隊がそこにいた
#   ② 図の外（海・イギリス側）に並べてあるもの ＝ 上陸予定日つきの編成表であって
#      位置ではない。**②は採らない。** 55 番の UTAH/OMAHA/GOLD/JUNO/SWORD の
#      上に並ぶ連合軍師団は全部②なので、この図から採れるのは
#      「12 日までに上陸を終えて地上にいる師団」だけになる。
#
# 精度: 独軍の司令部記号（B 軍集団・第 7 軍・第 15 軍）は実際の司令部所在地に
# 置かれている（ラ・ロシュ＝ギュイヨン／ル・マン／トゥールコワン）。
# 師団記号は数十 km の幅で見ること。コタンタン半島は図の癖でさらに 5〜8km ずれる。

- operation: overlord
  event: Q8641370          # オーヴァーロード作戦
