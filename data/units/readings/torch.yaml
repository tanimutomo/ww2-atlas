# トーチ作戦 1942。West Point アトラス 38（合成図）の上側から読み取った。
#
# ⚠ **この図には部隊の記号が無い。** 上陸を 3 本の太い矢印で示しているだけなので、
#   ノルマンディーと同じく**矢じりの先＝上陸地点、矢の向き＝進行方向**として読んだ。
#   西部機動部隊はサフィ・フェダラ・ポールリョーテの 3 か所に分かれて上陸しており、
#   主力が向かったフェダラ（カサブランカ正面）に置いている。
#   ⚠ 矢印が太く大きく描かれているので**矢じりの先が沖に出る**。西部機動部隊は
#     実際の上陸地から 38km、中部は 22km 沖にずれる（東部は 3km）。図がそう描いている。
# ⚠ 迎え撃ったのはヴィシー・フランス軍だが、**この図には敵側の記号が描かれていない**。
#   描かれていないものは足さない。
# ⚠ 3 つの機動部隊は Wikidata に項目が見つからないので自前 id。

