#   第 62 軍の欄の読みに自信が持てず、名前を写して間違えるより番号だけのほうがよい。
# ⚠ ソ連第 65 軍・第 51 軍は英語版の記事が現代の部隊に転送されるので自前 id。
#   ヴォロネジ方面軍は 1943 年に第 1 ウクライナ方面軍へ改称した同じ部隊なので
#   その項目（Q277985）を使っている。

