# バルバロッサ作戦 1941。West Point アトラス 19 番から「画素で」読み取った生の値。
#
# この図は 3000km を 1 枚に収めていて 1 画素 ≈ 2.7km。読み取り誤差がそのまま
# 20km 前後になるので、**方面軍・軍より下は置かない**。
#
# ⚠ ソ連側の方面軍（北部・北西・西部・予備・ブリャンスク・南西・南部）の箱は
#   後方に置いてあり、司令部の所在地というより「その方面軍の受け持ち」を指す。
#   ドイツ側の軍集団の箱も同じ読み方。
# ⚠ ルーマニア第 3 軍とソ連第 5 軍（1941 年）は Wikidata に相当する項目が
#   見つからなかったので自前 id。英語版の "5th Army (Soviet Union)" は
#   戦後の第 5 親衛諸兵科連合軍に転送されるので使わない。

