# P0/P1 で地図に出す Event の QID。ここに無いものは出力されない。
#
# 選び方:
#   ① data/links.yaml が指している QID と、override を書いた QID（参照切れはビルドが落ちる）
#   ② 座標があり、日付が「日」まで確かで、日本語版 Wikipedia に記事があるもの。
#      半年ごとに上限を設けて時期が偏らないようにしている
#
# ⚠ Wikidata の日付が年・月どまりのものは自動採用しない。
#    wdt: で取ると 1 月 1 日として返るため、年表上の位置が嘘になる
#    （対策前は 520 件中 52 件が 1/1 に固まっていた）。
#    出したい場合は override で start を手で与えて must 側に入れる。
#
# ⚠ フィードに短い要約を必ず出す方針にしたので、日本語版にも英語版にも記事が無く
#    要約の拠りどころが作れないものは外してある（2026-09-11 に 26 件。
#    うち 2 件は Wikidata にラベルすら無く、地図に QID がそのまま出ていた）。
#    Bircza の戦い（1945-10〜1946-01）はこの地図の時間軸の外なので同時に外した。
#
# 名前・日付・座標は data/raw/wikidata-events.json（CC0）から入る。
# 型・戦域・重要度は機械推定が既定値で、data/events/overrides/*.yaml が常に勝つ。
# 座標を持たない「作戦・戦役」「降伏文書」は override で coord を与えている。

