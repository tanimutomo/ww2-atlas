# Wikidata 由来の値に対する手当て。ここに書いた項目だけが raw を上書きする。
#
# 書く理由は主に 3 つ:
#   ① 座標が無い「作戦・戦役」に代表点を与える（無いと地図に出ない）
#   ② 機械推定（type / theatre / significance）が外れているものを直す
#   ③ P0 の芯になるイベントに自前の要約を付ける
#
# ここで手当てしていないイベントは、build-data.mjs の推定値がそのまま入り、
# 画面には「機械推定（人手未確認）」と表示される。
#
# significance: 3 は「地図でいちばん大きく出す」の意味。手で付けたときだけ 3 になる。
# 全件 verified: false（要約は自前だが原典確認は未了）。

