# 支配領域を切り出す日付。補間はしないので、ここに無い日は直前の枠が表示される。
#
# 四半期だけだと動きの速い時期が 1 コマに潰れる。とくに 1941-12〜1942-05 の
# 日本の南方進出は、四半期（1942-01-01 → 1942-07-01）だと半年ぶんが一気に広がって見えた。
# そこで **OHM が実際に版を分けている日** を転換日として足している
# （コメントの日付は OHM の relation の start_date / end_date に対応する）。
#
# 幾何は日付をまたいで共有するので（data/territory/geometry.json）、
# 日付を増やしてもコストはフレーム 1 枚ぶん（数十 KB）で済む。

