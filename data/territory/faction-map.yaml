# ohm_id → 支配区分（control）。地図の塗り分けはこのファイルだけで決まる。
#
# control: axis | axis_occupied | allied | allied_occupied | neutral | su
#
# 書き方は 2 通り:
#   1) 単一の値              12345: allied
#   2) 期間で変わる場合      12345:
#                              - { control: allied }
#                              - { control: axis_occupied, from: 1940-06-10 }
#      → keyframe の日付以下で **最後に当たった** 控えを採る（from の無い行が既定値）
#
# OHM は多くの政体を日付で版分けしてくれているので（ギリシャ・ベルギー・ルーマニアなど）、
# 期間指定が要るのは「同じ relation のまま陣営が変わった国」だけで済む。
#
# ⚠ P0 の割り切り（設計ノートの「未決」に対応）
#   - ソ連領内の独軍占領地域は OHM に面が無い。独ソ国境は開戦時のまま描かれる
#   - 日本占領下の中国（中國 relation は 14 枠とも同一）も同様に塗り分けられない
#   - ラテンアメリカは大半が 1941-42 に対枢軸宣戦しているが、P0 では neutral のままにしている
#   いずれも画面に注記を出す。P1 で戦況図のトレースを入れて解消する
#
# 出典: OpenHistoricalMap（境界・CC0）。陣営の割り当ては自前（未検証）

