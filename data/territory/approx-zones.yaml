# 折れ線からは導出できない支配領域を、範囲そのもので書く。
#
# 使いどころは 2 つ:
#   ① 連続した前線から切り離された孤立陣地（クールラント包囲）
#   ② そもそも「線」で表せない占領地域（日本占領下の中国）
#
# ここに書いた多角形は `clip_to` に当たる OHM の政体で切り抜かれる。
# つまり海岸線の細かさは OHM 側から来るので、**粗く・陸より外まで囲っておけばよい**
# （海に振り切った点を置いても切り落とされる）。
#
# ⚠ 範囲は概略。数十 km 単位の精度は無い。全件 verified: false。
#   coords は [経度, 緯度]。clip_to は政体名にかける正規表現。

- id: pk-kurland
  name_ja: クールラント包囲（北方軍集団の孤立）
  note_ja: |
    1944 年 10 月にメーメルが落ちて陸の連絡が切れたあと、
    ドイツ北方軍集団（のちクールラント軍集団）が
    ラトビア西部で降伏まで持ちこたえた区域。
    OHM は 1944 年以降オストラント国家弁務官区の面を持たないので、
    ここを書かないとラトビア西部が 1945 年までソ連領として塗られてしまう。
  from: 1944-10-10
  to: 1945-05-09
  control: axis_occupied
  clip_to: 'Soviet|ソビエト|ソ連'
  coords:
    - [20.8, 56.0]
    - [22.6, 56.1]
    - [23.3, 56.9]
    - [23.0, 57.5]
    - [20.8, 57.8]
  license: pd
  verified: false
  sources:
    - title: Courland Pocket
      url: https://en.wikipedia.org/wiki/Courland_Pocket
    - title: Baltic offensive
      url: https://en.wikipedia.org/wiki/Baltic_offensive

# ─────────────────────────────── 日本占領下の中国
#
# OHM は 1939-04-09〜1945-10-25 の「中國」relation を 1 本しか持たず、36 キーフレーム
# すべてで同一。つまり日中戦争の 8 年間、中国大陸はまったく塗り分けられない。
# Commons の月次図系列はヨーロッパのみで、中国を含む自由ライセンスのベクタ系列は無い
# （`Japanese Occupation of China 1940.svg` は CC BY-SA で 1940 年の 1 枚だけ）。
#
# ⚠ 大きな留保: 日本軍が握っていたのは実際には**都市と鉄道線**で、面ではない
#   （いわゆる「点と線」の支配）。ここでベタ塗りしているのは、
#   同時代の戦況図・現在の概説図がどれもそうしている慣例に合わせたもので、
#   実効支配の密度を表しているわけではない。省の内陸部には最後まで
#   国民政府軍・共産党軍の支配地域が残っている。

- id: zn-china-1937
  name_ja: 日本軍の占領地域（華北・長江下流）
  note_ja: |
    南京陥落から武漢作戦の直前まで。華北平原・山東・江蘇と、
    上海〜南京の長江下流をおさえた段階。黄河の線から西は
    まだ国民政府側にある（1938 年 6 月の黄河決壊も効いている）。
