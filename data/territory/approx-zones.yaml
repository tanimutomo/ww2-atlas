- id: zn-china-1938
  name_ja: 日本軍の占領地域（武漢・広州の攻略後）
  note_ja: |
    武漢と広州が落ちたあと、降伏まで大きくは動かなかった範囲。
    長江を宜昌まで遡り、岳陽から南昌にかけての線で 5 年半膠着した。
    福建省の内陸と沿岸の大半は最後まで国民政府側にある。
    1944 年の大陸打通作戦で足された回廊は zn-china-ichigo に分けてある
    （この範囲が縮んだわけではなく、南に伸びた）。
