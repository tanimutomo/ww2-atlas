# 前線ライン。日付ごとの折れ線で、支配領域の面（OHM）が埋められない部分を補う。
#
# なぜ要るか:
#   OHM の時点境界は「政体の境界」しか持たない。独ソ戦の戦線は国境ではないので、
#   ソ連領内に食い込んだドイツ軍の最深進出（モスクワ前面・スターリングラード・
#   コーカサス）が面としてまったく描けていなかった。
#   国家弁務官区（オストラント・ウクライナ）は面があるが、その東の軍政地域は無い。
#
# ⚠ 1939-08〜1942-12 のヨーロッパは、Commons の月次図から機械変換した
#   data/territory/control/ が実際の占領範囲を面で持っている（誤差 1.5km 前後）。
#   同じ範囲に概略線を重ねると二重になるので、その期間の東部戦線 2 本は落とした。
#   ここに残しているのは 1943 年以降＝面の手当てがまだ無い期間だけ。
#
# ⚠ この折れ線は **概略** で、地図をトレースしたものではない。
#   主要都市の位置と、そこが前線のどちら側だったかという広く知られた事実から引いている。
#   数十 km 単位の精度は無い。全件 verified: false。
#
#   正しく引き直すなら、下の sources に挙げた 2 系列をジオリファレンスしてトレースする:
#     - Commons「Second World War Europe MM YYYY」月次 SVG（1939-08〜1942-12・PD）
#     - 米陸軍参謀総長『Atlas of the World Battle Fronts in Semimonthly Phases』
#       （1943-07〜1945-08・半月刻み・米政府著作物）
#       https://archive.org/details/atlasofworldbatt00unse
#   1943 年前半の 6 ヶ月は両系列の隙間になる。
#
# coords は [経度, 緯度] の順。北から南へ並べる。

