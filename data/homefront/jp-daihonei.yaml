  type: announcement
  country: jp
  date: 1942-04-18
  headline_ja: 本土初空襲 ― 被害は軽微、敵機を撃墜したと発表
  body_ja: |
    米陸軍機による本土初空襲（ドーリットル空襲）について、被害は軽微であり
    来襲した敵機のうち数機を撃墜したと発表した。実際には日本上空で
    撃墜された機体はなく、爆撃を終えた機は大陸方面へ抜けている。
    この空襲が本土防衛の穴を露呈させ、ミッドウェー攻略（MI 作戦）を後押しした。
