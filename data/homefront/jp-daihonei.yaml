  country: jp
  date: 1942-05-08
  headline_ja: 珊瑚海海戦 ― 米空母 2 隻撃沈と発表
  body_ja: |
    珊瑚海での機動部隊同士の海戦について、米空母 2 隻を撃沈したと発表した。
