- id: hf-19411208-daihonei-kaisen
  type: announcement
  country: jp
  date: 1941-12-08
  headline_ja: 開戦の発表 ― 帝国陸海軍は本日未明、西太平洋において米英軍と戦闘状態に入れり
  body_ja: |
    12 月 8 日午前 6 時、ラジオの臨時ニュースで読み上げられた最初の大本営発表。
    西太平洋で米英軍と戦闘状態に入ったことだけを短く告げ、具体的な戦場や戦果には
    触れていない。これ以降、戦争の経過は大本営発表を通じて国民に伝えられる。
  license: link-only
  verified: false
  sources:
