      url: https://www.jacar.archives.go.jp/
      note: 原本は防衛研究所所蔵。本文は転載せずリンクのみ

- id: hf-19411208-daihonei-shinjuwan
  type: announcement
  country: jp
  date: 1941-12-08
  headline_ja: ハワイ空襲の戦果 ― 米太平洋艦隊の主力に甚大な損害を与えたと発表
  body_ja: |
    真珠湾攻撃の戦果として、米戦艦を主体とする艦隊に大きな損害を与えたと発表した。
    戦艦の被害についてはおおむね実態に近い規模が伝えられた一方で、
    攻撃時に米空母が真珠湾に不在で撃ち漏らしたこと ― この作戦の最大の取りこぼし ―
    には触れていない。
  license: link-only
