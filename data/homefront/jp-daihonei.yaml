- id: hf-19420610-daihonei-midway
  type: announcement
  country: jp
  date: 1942-06-10
  headline_ja: ミッドウェー海戦 ― 敵空母 2 隻撃沈、わが方の空母喪失は 1 隻と発表
  body_ja: |
    ミッドウェー海戦の結果として、米空母 2 隻を撃沈し、日本側の損害は
    空母 1 隻喪失・1 隻大破にとどまると発表した。実際には主力空母 4 隻すべてを
    失っており、発表は自軍の損害を大幅に小さく伝えている。
    生還した乗員は隔離され、敗北は陸軍にも十分に共有されなかった。
    発表と実態の乖離が決定的に広がった最初の転換点とされる。
