- id: hf-19450806-us-truman-atomic-statement
  coord: [-77.0365, 38.8951]
  type: announcement
  country: us
  date: 1945-08-06
  headline_ja: トルーマン声明 ― 広島に原子爆弾を投下したと公表
  body_ja: |
    ホワイトハウス声明で、広島に「原子爆弾」を投下したことを公表し、
    日本が降伏しなければ同種の攻撃を続けると警告した。
    日本側の同じ出来事の発表は「新型爆弾により相当の被害」であり、
    同じ事象に対する日米の発表の落差がそのまま並ぶ。
  license: pd
  verified: false
  sources:
    - title: Statement by the President Announcing the Use of the A-Bomb at Hiroshima（Truman Library・米政府著作物）
      url: https://www.trumanlibrary.gov/library/public-papers/93/statement-president-announcing-use-bomb-hiroshima
    - title: Chronicling America（米議会図書館・1945-08-07 の紙面）
      url: https://www.loc.gov/collections/chronicling-america/?start_date=1945-08-07&end_date=1945-08-07

