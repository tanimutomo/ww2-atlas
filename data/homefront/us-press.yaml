# 米国の報道・世論・大統領演説。P0 は 10 件。
#
# 米国側は一次史料の状態がいちばんよく、Chronicling America（米議会図書館）で
# 日付を指定して当日の新聞 1 面を OCR 全文つきで引ける。大統領の演説・炉辺談話は
# 米政府著作物なのでパブリックドメイン（license: pd）。
#
# 「日本は発表を統制し、米国は 1 面がそのまま残っている」という非対称そのものが、
# 国内レイヤーを並べたときの見どころになる。

- id: hf-19390901-us-press-poland
  coord: [-74.006, 40.7128]
  type: press
  country: us
  date: 1939-09-01
  headline_ja: 米各紙 1 面「ドイツ、ポーランドに侵攻」― 欧州大戦の勃発を報じる
  body_ja: |
    ドイツのポーランド侵攻を各紙が 1 面で報じた。アメリカは中立を保つ立場で、
    参戦の是非をめぐる国内世論は割れていた。当日の紙面は
    Chronicling America で日付を指定して閲覧できる。
  license: pd
  verified: false
  sources:
    - title: Chronicling America（米議会図書館・1939-09-01 の紙面）
      url: https://www.loc.gov/collections/chronicling-america/?start_date=1939-09-01&end_date=1939-09-01
      note: パブリックドメイン。日付指定で当日の 1 面を引ける

- id: hf-19401229-us-fireside-arsenal
  coord: [-77.0365, 38.8951]
  type: opinion
  country: us
  date: 1940-12-29
  headline_ja: ローズヴェルト炉辺談話「民主主義の兵器廠」
  body_ja: |
    ラジオ炉辺談話で、アメリカは参戦しないが英国など枢軸国と戦う国々に
    武器を供給する「民主主義の兵器廠」になるべきだと訴えた。
    翌 1941 年 3 月の武器貸与法（レンドリース）につながる世論形成の起点になった。
  license: pd
  verified: false
  sources:
    - title: Franklin D. Roosevelt — Fireside Chats（米政府著作物）
      url: https://en.wikisource.org/wiki/Author:Franklin_Delano_Roosevelt
    - title: Arsenal of Democracy
      url: https://en.wikipedia.org/wiki/Arsenal_of_Democracy

- id: hf-19411208-us-press-pearl-harbor
  coord: [-74.006, 40.7128]
  type: press
  country: us
  date: 1941-12-08
  headline_ja: 米各紙 1 面「日本、アメリカを攻撃」― 真珠湾攻撃を報じる
  body_ja: |
    前日の真珠湾攻撃を各紙が号外・1 面で一斉に報じた。
    参戦をめぐって割れていた国内世論は一日で反転し、
    孤立主義はほぼ消滅する。当日の紙面が日付指定で残っている。
  license: pd
  verified: false
  sources:
    - title: Chronicling America（米議会図書館・1941-12-08 の紙面）
      url: https://www.loc.gov/collections/chronicling-america/?start_date=1941-12-08&end_date=1941-12-08
      note: パブリックドメイン。日付指定で当日の 1 面を引ける

- id: hf-19411208-us-infamy-speech
  coord: [-77.0365, 38.8951]
  type: opinion
  country: us
  date: 1941-12-08
  headline_ja: ローズヴェルト議会演説「屈辱の日」― 対日宣戦を要請
  body_ja: |
    上下両院合同会議での演説で、前日の攻撃を「汚辱の日」と呼び、
    対日宣戦布告を要請した。議会は即日これを可決している。
    演説の全文は米政府著作物としてパブリックドメイン。
  license: pd
