      url: https://en.wikipedia.org/wiki/Infamy_Speech

- id: hf-19420607-us-press-midway
  coord: [-74.006, 40.7128]
  type: press
  country: us
  date: 1942-06-07
  headline_ja: 米各紙「ミッドウェーで日本艦隊に大打撃」― 太平洋の転機を報じる
  body_ja: |
    ミッドウェー海戦の戦果を各紙が報じた。米側は暗号解読による
    事前察知を伏せたまま勝利を伝えており、報道と作戦保全のせめぎ合いがある。
    同じ戦いを日本側は「空母 1 隻喪失」と発表しており、
    同じ日付の日米の紙面を並べると発表の差がそのまま見える。
  license: pd
  verified: false
  sources:
    - title: Chronicling America（米議会図書館・1942-06-07 の紙面）
      url: https://www.loc.gov/collections/chronicling-america/?start_date=1942-06-07&end_date=1942-06-07
      note: パブリックドメイン。日付指定で当日の 1 面を引ける
    - title: Battle of Midway
      url: https://en.wikipedia.org/wiki/Battle_of_Midway

