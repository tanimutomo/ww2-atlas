# 日本国内の生活（配給・統制・疎開）。P0 は 10 行。
#
# 「戦場で何が起きたか」の裏で、国民の暮らしがどう締め上げられていったかを
# 同じ時間軸に置くための最小セット。切符制・通帳制の開始日は制度の告示日と
# 実施日がずれることがあり、ここでは広く採られている実施年月を採っている
# （全件 verified: false。P1 で官報・国立公文書館の告示に当てる）。

- id: hf-19400601-jp-life-kippu
  coord: [139.7528, 35.6852]
  type: life
  country: jp
  date: 1940-06-01
  headline_ja: 砂糖・マッチが切符制に ― 生活必需品の配給統制が始まる
  body_ja: |
    砂糖とマッチが切符制になり、日常の必需品にまで配給統制が及んだ。
    以後、味噌・醤油・木炭・衣料へと対象が広がっていく。
    開戦の 1 年半前から生活の締め付けが始まっていたことになる。
  license: pd
  verified: false
