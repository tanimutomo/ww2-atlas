- id: hf-19410401-jp-life-beikoku-tsucho
  coord: [139.7528, 35.6852]
  type: life
  country: jp
  date: 1941-04-01
  headline_ja: 六大都市で米穀配給通帳制が始まる ― 主食が通帳管理に
  body_ja: |
    東京・大阪など六大都市で米の配給が通帳制になり、
    世帯ごとに定められた量しか受け取れなくなった。
    のちに全国へ拡大し、成人 1 日あたりの配給量は戦争末期に向けて減っていく。
  license: pd
  verified: false
  sources:
    - title: 配給 (物資)
      url: https://ja.wikipedia.org/wiki/%E9%85%8D%E7%B5%A6_(%E7%89%A9%E8%B3%87)
