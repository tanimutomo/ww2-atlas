- id: hf-19420201-jp-life-iryo-kippu
  coord: [139.7528, 35.6852]
  type: life
  country: jp
  date: 1942-02-01
  headline_ja: 衣料切符制が始まる ― 服も点数で買う時代に
  body_ja: |
    衣料品が点数切符制になり、1 年間に使える点数の範囲でしか
    衣類を買えなくなった。国民服・もんぺが標準的な装いになっていく。
    緒戦の勝利が報じられている時期に、生活面ではすでに窮乏が進んでいた。
  license: pd
  verified: false
  sources:
    - title: 配給 (物資)
      url: https://ja.wikipedia.org/wiki/%E9%85%8D%E7%B5%A6_(%E7%89%A9%E8%B3%87)
