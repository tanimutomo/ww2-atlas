- id: hf-19400907-jp-life-zeitaku
  coord: [139.7528, 35.6852]
  type: policy
  country: jp
  date: 1940-08-01
  headline_ja: 「ぜいたくは敵だ」― 奢侈品等製造販売制限規則の施行
  body_ja: |
    奢侈品等製造販売制限規則（いわゆる七・七禁令）により、
    高級品の製造・販売が制限された。街頭には標語看板が立ち、
    生活様式そのものが統制の対象になっていく。
  license: pd
  verified: false
  sources:
