- id: hf-19440630-jp-life-gakudo-sokai
  coord: [139.7528, 35.6852]
  type: life
  country: jp
  date: 1944-06-30
  headline_ja: 学童疎開の開始 ― 都市の国民学校児童が集団で地方へ
  body_ja: |
    サイパン失陥が迫るなか、都市部の国民学校児童を地方へ
    集団疎開させる方針が決まり、夏から実施された。
    本土空襲が現実の前提になったことを、家族の分離という形で示している。
  license: pd
  verified: false
