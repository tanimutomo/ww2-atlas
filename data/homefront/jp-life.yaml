- id: hf-19440330-jp-life-kessenhijo
  coord: [139.7528, 35.6852]
  type: policy
  country: jp
  date: 1944-03-07
  headline_ja: 決戦非常措置要綱 ― 高級料亭・劇場の閉鎖、中等学校の授業停止へ
  body_ja: |
    決戦非常措置要綱により、高級飲食店や劇場が閉鎖され、
    学生の勤労動員が本格化した。都市生活の娯楽が事実上停止する。
  license: pd
