- id: hf-19430921-jp-life-gakuto
  coord: [139.7528, 35.6852]
  type: policy
  country: jp
  date: 1943-10-21
  headline_ja: 学徒出陣 ― 文科系学生の徴集猶予が停止される
  body_ja: |
    在学徴集延期臨時特例により文科系学生の徴兵猶予が停止され、
    10 月 21 日に明治神宮外苑競技場で出陣学徒壮行会が行われた。
    兵力の枯渇が学生にまで及んだことを国民に可視化した出来事でもある。
  license: pd
  verified: false
  sources:
    - title: 学徒出陣
      url: https://ja.wikipedia.org/wiki/%E5%AD%A6%E5%BE%92%E5%87%BA%E9%99%A3
