- id: hf-19441124-jp-life-b29
  coord: [139.7528, 35.6852]
  type: life
  country: jp
  date: 1944-11-24
  headline_ja: マリアナ基地からの B-29 が東京を初空襲 ― 本土空襲が日常に
  body_ja: |
    サイパンなどマリアナ諸島の基地から発進した B-29 による
    東京への本格的な空襲が始まった。以後、警報と防空壕への退避が
    都市生活の日常になる。絶対国防圏が破られた結果が
    国民生活に直接現れた局面。
  license: pd
  verified: false
  sources:
    - title: 東京大空襲
      url: https://ja.wikipedia.org/wiki/%E6%9D%B1%E4%BA%AC%E5%A4%A7%E7%A9%BA%E8%A5%B2
    - title: Bombing of Tokyo
      url: https://en.wikipedia.org/wiki/Bombing_of_Tokyo

- id: hf-19450311-jp-life-tokyo-risai
  coord: [139.7528, 35.6852]
  type: life
  country: jp
  date: 1945-03-11
  headline_ja: 東京大空襲の翌日 ― 下町が焼失し 100 万人規模が罹災
  body_ja: |
    3 月 10 日未明の空襲により下町一帯が焼失し、
    100 万人規模が家を失った。大本営発表では被害の規模は伝えられていない。
    以後、名古屋・大阪・神戸と主要都市への焼夷弾攻撃が続く。
  license: pd
  verified: false
  sources:
    - title: 東京大空襲
      url: https://ja.wikipedia.org/wiki/%E6%9D%B1%E4%BA%AC%E5%A4%A7%E7%A9%BA%E8%A5%B2
    - title: Bombing of Tokyo (10 March 1945)
      url: https://en.wikipedia.org/wiki/Bombing_of_Tokyo_(10_March_1945)

- id: hf-19450815-jp-life-gyokuon
  coord: [139.7528, 35.6852]
  type: announcement
  country: jp
  date: 1945-08-15
  headline_ja: 玉音放送 ― 終戦の詔書がラジオで読み上げられる
  body_ja: |
    正午、昭和天皇による終戦の詔書の録音がラジオで放送された。
    「堪ヘ難キヲ堪ヘ」の一節で知られる。多くの国民にとって
    敗戦を知る瞬間であり、大本営発表が伝えてきた戦況と
    実態との落差が一挙に露わになった日でもある。
  license: pd
  verified: true
  sources:
    - title: 大東亞戰爭終結ノ詔書（原文・Wikisource）
      url: https://ja.wikisource.org/wiki/%E5%A4%A7%E6%9D%B1%E4%BA%9E%E6%88%B0%E7%88%AD%E7%B5%82%E7%B5%90%E3%83%8E%E8%A9%94%E6%9B%B8
    - title: 玉音放送
      url: https://ja.wikipedia.org/wiki/%E7%8E%89%E9%9F%B3%E6%94%BE%E9%80%81
