      url: https://en.wikipedia.org/wiki/State_Defense_Committee
    - title: Joseph Stalin
      url: https://en.wikipedia.org/wiki/Joseph_Stalin

- id: dec-19420913-uranus
  coord: [37.618, 55.752]
  type: order
  name_ja: ウラヌス作戦の承認（スターリングラードでの反攻計画）
  name_en: Approval of Operation Uranus
  date: 1942-09-13
  end: null
  actors: [su]
  persons: [スターリン, ジューコフ, ヴァシレフスキー]
  place: モスクワ・クレムリン
  summary_ja: |
    市街戦に兵力を注ぎ込むのではなく、両翼のルーマニア軍正面を破って
    包囲するという構想を、ジューコフとヴァシレフスキーが提案し
    スターリンが承認した。以後 2 か月、市内では消耗戦を続けながら
    翼側に予備兵力を秘匿して集めることになる。実行は 11 月 19 日。
  decisions_ja:
    - 市内での反撃ではなく、両翼からの包囲を選ぶ
    - 準備期間を 2 か月とり、予備兵力を秘匿して集中する
  license: pd
  verified: false
  sources:
    - title: Operation Uranus
      url: https://en.wikipedia.org/wiki/Operation_Uranus
    - title: Battle of Stalingrad
      url: https://en.wikipedia.org/wiki/Battle_of_Stalingrad

- id: dec-19450808-declare-war-japan
  coord: [37.618, 55.752]
  type: declaration
  name_ja: ソ連の対日宣戦布告
  name_en: Soviet declaration of war on Japan
  date: 1945-08-08
  end: null
  actors: [su, jp]
  persons: [モロトフ, スターリン, 佐藤尚武]
  place: モスクワ
  summary_ja: |
    ヤルタでの密約（ドイツ降伏の 3 か月後に対日参戦）に沿って、
    モロトフ外相が佐藤大使に宣戦を通告した。日本政府はこの時点まで
    ソ連を和平の仲介者として頼っており、その前提が消えたことは
    広島への原爆投下と並んで受諾の決断を早める要因になった。
    通告の数時間後に満洲侵攻が始まる。
  decisions_ja:
    - 8 月 9 日をもって日本と戦争状態に入る
    - ポツダム宣言に加わる
  license: pd
  verified: false
