- id: dec-19391130-winter-war
  coord: [37.618, 55.752]
  type: order
  name_ja: 対フィンランド攻撃の決定（冬戦争の開始）
  name_en: Soviet decision to attack Finland
  date: 1939-11-30
  end: null
  actors: [su, fi]
  persons: [スターリン, モロトフ, メレツコフ]
  place: モスクワ
  summary_ja: |
    レニングラード防衛のための領土交換交渉が決裂したあと、
    国境のマイニラで自国側に着弾があったとして、これを口実に攻撃を始めた。
    3 か月半の戦闘で赤軍は大きな損害を出し、その様子が
    「ソ連軍は弱い」という評価をドイツ側に与えることになる。
  decisions_ja:
    - フィンランドへの武力行使に踏み切る
    - マイニラ砲撃事件を開戦の根拠とする
    - 傀儡政権（テリヨキ政府）を立てて交渉相手を置き換える
  license: pd
  verified: false
  sources:
    - title: Winter War
      url: https://en.wikipedia.org/wiki/Winter_War
    - title: Shelling of Mainila
      url: https://en.wikipedia.org/wiki/Shelling_of_Mainila

- id: dec-19410624-sovinformburo
  coord: [37.618, 55.752]
  type: order
  name_ja: ソビエト情報局と疎開評議会の設置
  name_en: Sovinformburo and the Evacuation Council
  date: 1941-06-24
  end: null
  actors: [su]
  persons: [スターリン, シュヴェルニク, モロトフ]
  place: モスクワ
  summary_ja: |
    独ソ戦の開始 2 日後に、戦況発表を一元化するソビエト情報局と、
    西部の工業設備を東方へ移すための疎開評議会を同じ日に設けた。
    前者は国内向けの情報の窓口、後者は数千の工場をウラル以東へ
    動かす実務機関で、この 2 つが「発表」と「実態」の両側を支えた。
  decisions_ja:
    - 戦況の公式発表をソビエト情報局に一元化する
    - 西部の工業設備と労働者を東方へ疎開させる機関を設ける
  license: pd
  verified: false
  sources:
    - title: Sovinformburo
      url: https://en.wikipedia.org/wiki/Sovinformburo
    - title: Eastern Front (World War II)
      url: https://en.wikipedia.org/wiki/Eastern_Front_(World_War_II)

- id: dec-19410630-gko
  coord: [37.618, 55.752]
  type: order
  name_ja: 国家防衛委員会（GKO）の設置
  name_en: Establishment of the State Defense Committee
  date: 1941-06-30
  end: null
  actors: [su]
  persons: [スターリン, モロトフ, ベリヤ, マレンコフ, ヴォロシーロフ]
  place: モスクワ・クレムリン
  summary_ja: |
    党・政府・軍の権限を 5 人の委員会に集中させ、その決定に
    すべての機関が従う体制を作った。スターリンが議長となり、
    以後の動員・生産・作戦はこの委員会の決定として出される。
    独ソ戦の 8 日目に、戦時の意思決定を一本化した措置。
  decisions_ja:
    - 国家防衛委員会に全権を集中する
    - スターリンが議長を務める
    - 委員会決定は法律と同等の効力を持つ
  license: pd
