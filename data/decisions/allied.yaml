  place: ワシントン
  summary_ja: |
    交戦国への武器禁輸を解き、代金前払い・買い手の船での輸送を条件に
    武器を売れるようにした改正。海上を支配していた英仏だけが実際には
    利用でき、中立を掲げたまま連合国側に物資を流す仕組みになった。
    武器貸与法（1941 年 3 月）に至る第一歩にあたる。
