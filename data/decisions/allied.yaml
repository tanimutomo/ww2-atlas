- id: dec-19450204-yalta
  coord: [34.166, 44.495]
  type: conference
  name_ja: ヤルタ会談
  name_en: Yalta Conference
  date: 1945-02-04
  end: 1945-02-11
  actors: [us, uk, su]
  persons: [ローズヴェルト, チャーチル, スターリン]
  place: クリミア・ヤルタ
  summary_ja: |
    ドイツ敗戦が視野に入った段階の米英ソ首脳会談。ドイツの分割占領と
    非武装化、解放ヨーロッパにおける自由選挙、国際連合の設立手続きを決めた。
    秘密協定として、ソ連がドイツ降伏の 2〜3 か月後に対日参戦することと、
    その代償（南樺太・千島の帰属など）が取り決められた。
  decisions_ja:
    - ドイツを米英ソ仏で分割占領し非武装化する
    - 解放された諸国で自由選挙を行う（ヨーロッパ解放宣言）
    - 国際連合の設立会議を 4 月にサンフランシスコで開く
    - ソ連はドイツ降伏の 2〜3 か月後に対日参戦する（秘密協定）
  license: pd
  verified: false
  sources:
    - title: FRUS — The Conferences at Malta and Yalta, 1945
      url: https://history.state.gov/historicaldocuments/frus1945Malta
    - title: Yalta Conference
      url: https://en.wikipedia.org/wiki/Yalta_Conference

- id: dec-19450717-potsdam
  coord: [13.06, 52.4]
  type: conference
  name_ja: ポツダム会談（ポツダム宣言）
  name_en: Potsdam Conference (Potsdam Declaration)
  date: 1945-07-17
  end: 1945-08-02
  actors: [us, uk, su]
  persons: [トルーマン, チャーチル, アトリー, スターリン]
  place: ドイツ・ポツダム
  summary_ja: |
    ドイツ降伏後の戦後処理と対日方針を決めた最後の三国首脳会談。
    7 月 26 日、米英中の名で日本に無条件降伏を求めるポツダム宣言が発せられた
    （ソ連はこの時点で対日中立のため署名せず、8 月 8 日の宣戦時に参加）。
    会談中にトルーマンは原爆実験成功の報を受け取っている。
  decisions_ja:
    - 日本に対し降伏条件を示し、受諾しなければ「迅速かつ完全な壊滅」を警告する
    - カイロ宣言の条項を履行させ、日本の主権を本土 4 島に限定する
    - ドイツの非ナチ化・非軍事化・賠償の方針を定める
    - ドイツの東部国境を暫定的にオーデル・ナイセ線とする
  license: pd
  verified: true
  sources:
    - title: Potsdam Declaration（全文・Wikisource）
      url: https://en.wikisource.org/wiki/Potsdam_Declaration
    - title: FRUS — The Conference of Berlin (Potsdam Conference), 1945, Vol. I
      url: https://history.state.gov/historicaldocuments/frus1945Berlinv01

