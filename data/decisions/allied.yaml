- id: dec-19410726-freeze-japanese-assets
  coord: [-77.036, 38.895]
  type: order
  name_ja: 在米日本資産の凍結（と事実上の石油禁輸）
  name_en: Freezing of Japanese assets in the United States
  date: 1941-07-26
  end: null
  actors: [us, uk, nl]
  persons: [ローズヴェルト, ハル, アチソン]
  place: ワシントン
  summary_ja: |
    南部仏印進駐に対する報復として、在米日本資産を凍結した。
    形式上は輸出許可制で石油を止めたわけではないが、決済を許可する
    運用が行われなかったため、8 月以降は石油の対日輸出が事実上ゼロになる。
    英蘭も同調し、日本は「輸入の道を絶たれた状態で交渉するか、開戦するか」
    という時間の制約を負うことになった。
  decisions_ja:
    - 在米日本資産を凍結する
    - 対日輸出を許可制とし、実際には石油の輸出許可を出さない
    - イギリス・オランダ領東インドも同調させる
  license: pd
  verified: false
  sources:
