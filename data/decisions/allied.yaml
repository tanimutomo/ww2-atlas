    シチリア攻略完了直後の米英会談。オーヴァーロード作戦を 1944 年の
    最優先作戦として正式に承認し、東南アジア方面の指揮系統として
    東南アジア司令部（SEAC）の設置を決めた。原子爆弾開発に関する
    米英の協定（ケベック協定）もここで結ばれている。
  decisions_ja:
    - オーヴァーロード作戦を 1944 年の最優先作戦として承認する
    - 東南アジア司令部（SEAC）を設置する
    - 原子力研究における米英加の協力を定める（ケベック協定）
    - イタリア本土への進攻を継続する
  license: pd
