  name_en: Tehran Conference
  date: 1943-11-28
  end: 1943-12-01
  actors: [us, uk, su]
  persons: [ローズヴェルト, チャーチル, スターリン]
  place: イラン・テヘラン
  summary_ja: |
    米英ソ三国首脳の初の直接会談。スターリンの強い要求を受け、
    オーヴァーロード作戦を 1944 年 5 月に実行することを確約し、
    あわせて南フランス上陸（アンヴィル作戦）を行うこととした。
    ソ連はドイツ降伏後に対日参戦する意向をここで初めて表明している。
  decisions_ja:
    - オーヴァーロード作戦を 1944 年 5 月に実行する
    - あわせて南フランスへの上陸作戦を行う
    - ソ連は東部戦線で呼応する攻勢を発起する
    - ソ連はドイツ降伏後に対日参戦する意向を示す
  license: pd
  verified: false
  sources:
