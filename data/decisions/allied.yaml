- id: dec-19431122-cairo
  coord: [31.235, 30.044]
  type: conference
  name_ja: カイロ会談（カイロ宣言）
  name_en: Cairo Conference (Cairo Declaration)
  date: 1943-11-22
  end: 1943-11-26
  actors: [us, uk, cn]
  persons: [ローズヴェルト, チャーチル, 蒋介石]
  place: エジプト・カイロ
  summary_ja: |
    米英中の首脳が対日戦の方針を協議した会談。共同発表（カイロ宣言）で
    日本に無条件降伏を求め、第一次大戦以降に日本が獲得した太平洋の島々の
    剥奪、満洲・台湾・澎湖の中国への返還、朝鮮の独立を掲げた。
    のちのポツダム宣言はこの条項の履行を求める形をとる。
  decisions_ja:
    - 日本に対し無条件降伏を求める
    - 日本が第一次大戦以降に獲得した太平洋諸島を剥奪する
    - 満洲・台湾・澎湖諸島を中国に返還させる
    - 朝鮮を独立させる
  license: pd
  verified: true
  sources:
    - title: Cairo Declaration（全文・Wikisource）
      url: https://en.wikisource.org/wiki/Cairo_Declaration
    - title: FRUS — The Conferences at Cairo and Tehran, 1943
      url: https://history.state.gov/historicaldocuments/frus1943CairoTehran

- id: dec-19431128-tehran
  coord: [51.389, 35.689]
  type: conference
