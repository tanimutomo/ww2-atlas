  summary_ja: |
    アメリカが交戦国に武器・物資を貸与・供与できるようにした法律。
    中立を保ちながら実質的に連合国側を支える枠組みで、
    独ソ開戦後はソ連も対象になった。「民主主義の兵器廠」演説の
