  place: サンフランシスコ
  summary_ja: |
    50 か国が参加して国際連合憲章を起草・署名した会議。
    ドイツ降伏をまたいで 2 か月続き、6 月 26 日に憲章が署名された。
    大西洋憲章から始まった戦後構想がここで形になる。
  decisions_ja:
    - 国際連合憲章を起草し署名する
