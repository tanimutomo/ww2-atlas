  name_ja: モスクワ外相会議
  name_en: Moscow Conference (1943)
  date: 1943-10-19
  end: 1943-10-30
  actors: [us, uk, su, cn]
  persons: [ハル, イーデン, モロトフ]
  place: モスクワ
  summary_ja: |
    米英ソの外相が集まり、戦後の国際機構の設立と、
    ドイツの戦争犯罪の訴追について合意した。
    テヘラン会談（翌月）の地ならしにあたり、
    ここでの一般的安全保障に関する宣言が国際連合の出発点になる。
  decisions_ja:
