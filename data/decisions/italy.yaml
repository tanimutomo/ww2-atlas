- id: dec-19400610-italy-enters-war
  coord: [12.4964, 41.9028]
  type: declaration
  name_ja: イタリアの参戦（対英仏宣戦布告）
  name_en: Italian declaration of war on France and Britain
  date: 1940-06-10
  end: null
  actors: [it, fr, uk]
  persons: [ムッソリーニ, ヴィットーリオ・エマヌエーレ 3 世]
  place: ローマ・ヴェネツィア宮殿
  summary_ja: |
    フランスの敗色が濃厚になった段階で、ムッソリーニがバルコニーから
    群衆に向けて対英仏宣戦を告げた。短期で終わる戦争に間に合わせ、
    講和の席で分け前を得ることが狙いだったが、
    以後イタリアはギリシャ・北アフリカで苦戦し、ドイツの支援を要することになる。
  decisions_ja:
    - イギリス・フランスに宣戦を布告する
    - フランス南部への攻勢を発起する
