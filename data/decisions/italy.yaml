- id: dec-19401028-greco-italian
  coord: [12.4964, 41.9028]
  type: order
  name_ja: ギリシャ侵攻の決定（対ギリシャ最後通牒）
  name_en: Italian ultimatum and invasion of Greece
  date: 1940-10-28
  end: null
  actors: [it, gr]
  persons: [ムッソリーニ, チアノ]
  place: ローマ
  summary_ja: |
    ドイツに事前に相談せず、アルバニアからギリシャへ侵攻することを決めた。
    ムッソリーニがドイツの独走に対抗して「並行戦争」を示そうとしたものだが、
    ギリシャ軍の反撃でアルバニアまで押し返され、
    翌春のドイツによるバルカン作戦（マリータ）を招くことになる。
  decisions_ja:
    - ギリシャに最後通牒を発し、拒否されしだい侵攻する
    - アルバニアを起点に進攻する
    - ドイツには事前に通報しない
  license: pd
  verified: false
  sources:
    - title: Greco-Italian War
      url: https://en.wikipedia.org/wiki/Greco-Italian_War

- id: dec-19430725-mussolini-deposed
  coord: [12.4964, 41.9028]
  type: conference
  name_ja: ファシズム大評議会の決議とムッソリーニ解任
  name_en: Dismissal of Mussolini by the Grand Council of Fascism
  date: 1943-07-24
  end: 1943-07-25
  actors: [it]
  persons: [ムッソリーニ, グランディ, ヴィットーリオ・エマヌエーレ 3 世, バドリオ]
  place: ローマ・ヴェネツィア宮殿
  summary_ja: |
    シチリア上陸とローマ空襲を受けて開かれたファシズム大評議会が、
    軍の統帥権を国王に返上する動議を可決した。翌 25 日に国王は
    ムッソリーニを解任・逮捕し、バドリオを首相に任命する。
    このあと水面下で連合国との休戦交渉が始まり、9 月の休戦につながる。
  decisions_ja:
    - 統帥権を国王に返上する動議を可決する（グランディ動議）
    - 国王がムッソリーニを解任し、バドリオを首相に任命する
    - ファシスト党を解散する
  license: pd
  verified: false
  sources:
