      url: https://en.wikipedia.org/wiki/List_of_Adolf_Hitler%27s_directives
      note: locator。原文の所在は要確認
    - title: Invasion of Yugoslavia
      url: https://en.wikipedia.org/wiki/Invasion_of_Yugoslavia

- id: dec-19420405-weisung-41
  type: directive
  name_ja: 総統指令第 41 号「青作戦」（南方攻勢＝スターリングラード・コーカサス）
  name_en: Führer Directive No. 41 (Case Blue)
  date: 1942-04-05
  end: null
  actors: [de]
  persons: [ヒトラー]
  place: ベルリン
  summary_ja: |
    1942 年夏季攻勢の方針を定めた指令。モスクワ正面ではなく南方に主力を振り、
    ドン河湾曲部のソ連軍を撃滅した上でコーカサスの油田地帯を獲得することを
    目標に据えた。スターリングラードは当初、側面を守るための目標として位置づけ
    られていたが、のちに攻勢そのものの焦点に変わっていく。
  decisions_ja:
    - 1942 年夏季攻勢の主力を南方に振る
    - ドン河湾曲部でソ連軍を撃滅する
    - コーカサスの油田地帯を獲得する
    - スターリングラード方面は側面確保の目標とする
  license: pd
  verified: false
  sources:
    - title: List of Adolf Hitler's directives（総統指令の一覧）
      url: https://en.wikipedia.org/wiki/List_of_Adolf_Hitler%27s_directives
      note: locator。原文の所在は要確認
    - title: Case Blue
      url: https://en.wikipedia.org/wiki/Case_Blue

- id: dec-19430415-zitadelle
  type: order
  name_ja: 作戦命令第 6 号「ツィタデレ作戦」（クルスク攻勢）
  name_en: Operation Order No. 6 (Operation Citadel)
  date: 1943-04-15
  end: null
  actors: [de]
  persons: [ヒトラー, ツァイツラー]
  place: ベルリン
  summary_ja: |
    クルスク突出部を南北から挟撃して包囲する攻勢を命じた作戦命令。
    「東部戦線における今年の最も重要な攻勢」と位置づけ、成功のために
    最良の部隊・武器・指揮官を集中するとした。新型戦車の到着を待って
    開始が 7 月まで繰り延べられ、その間にソ連側の防御準備が整った。
  decisions_ja:
    - クルスク突出部を南北から挟撃・包囲する
    - 東部戦線における 1943 年の最重要攻勢と位置づける
    - 最良の部隊と新型戦車を集中投入する
    - 開始日は状況に応じて決定する（実際には 7 月 5 日）
  license: pd
  verified: false
  sources:
