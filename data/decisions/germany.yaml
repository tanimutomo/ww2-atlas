- id: dec-19431103-weisung-51
  coord: [13.405, 52.52]
  type: directive
  name_ja: 総統指令第 51 号（西方の防備強化）
  name_en: Führer Directive No. 51 (Defence of the West)
  date: 1943-11-03
  end: null
  actors: [de]
  persons: [ヒトラー]
  place: ベルリン
  summary_ja: |
    連合軍の西方上陸が近いという判断のもと、東部戦線から西方へ重点を移すことを
    命じた指令。「東方では空間の広さが、最悪の場合でも致命的でない領土喪失を
    許すが、西方では違う」として、上陸を water's edge で阻止する方針を打ち出した。
    大西洋の壁の増強と機動予備の配置がこの指令に基づく。
  decisions_ja:
    - 西方の防備を東部戦線より優先する
    - 上陸してくる敵を海岸線で阻止する
    - 西方の装甲・機動予備を増強する
    - 東方は空間的余裕があるため territorial な後退を許容する
