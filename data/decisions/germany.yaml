- id: dec-19401218-weisung-21
  type: directive
  name_ja: 総統指令第 21 号「バルバロッサ作戦」
  name_en: Führer Directive No. 21 (Case Barbarossa)
  date: 1940-12-18
  end: null
  actors: [de]
  persons: [ヒトラー, カイテル, ヨードル]
  place: ベルリン
  summary_ja: |
    ソ連侵攻を命じた指令。「ドイツ国防軍はソビエト・ロシアを迅速な戦役で打倒する
    準備を整えるべし」として、準備完了期限を 1941 年 5 月 15 日と定めた。作戦目標は
    西部ロシアのソ連軍を前線で撃滅し、アルハンゲリスク〜ヴォルガ線まで進出すること。
    バルカン方面の作戦により実際の開始は 6 月 22 日にずれ込む。
  decisions_ja:
    - ソ連に対する侵攻作戦（バルバロッサ）の準備を命じる
    - 準備完了期限を 1941 年 5 月 15 日とする
    - 西部ロシアのソ連軍主力を国境付近で撃滅する
    - 最終到達線をアルハンゲリスク〜ヴォルガ線に置く
    - 対英戦は継続しつつ、東方作戦を優先する
  license: pd
  verified: false
  sources:
    - title: Führer Directive 21（英訳全文・Wikisource）
      url: https://en.wikisource.org/wiki/F%C3%BChrer_Directive_21
      note: パブリックドメイン。P0 で唯一、原文（英訳）が引けている指令
    - title: Operation Barbarossa
      url: https://en.wikipedia.org/wiki/Operation_Barbarossa

- id: dec-19410327-weisung-25
  type: directive
  name_ja: 総統指令第 25 号（ユーゴスラビア侵攻）
  name_en: Führer Directive No. 25 (Invasion of Yugoslavia)
  date: 1941-03-27
  end: null
  actors: [de]
  persons: [ヒトラー]
  place: ベルリン
  summary_ja: |
    ベオグラードでのクーデタにより三国同盟加入が覆されたことを受け、ユーゴスラビアを
    「軍事的に打倒し、国家として解体する」ことを命じた指令。ギリシャ方面の作戦
    （マリータ）と併せて 4 月に実行され、その分の時間がバルバロッサ開始を後ろに
    ずらす結果になった。
  decisions_ja:
    - ユーゴスラビアを軍事的に打倒し国家として解体する
    - ギリシャ方面作戦（マリータ）と同時並行で実施する
    - 可能な限り早期に開始する（4 月 6 日に実行）
  license: pd
