- id: dec-19390411-fall-weiss
  type: directive
  name_ja: 「1939/40 年の戦争準備に関する指令」（白作戦＝対ポーランド）
  name_en: Directive for the Armed Forces 1939/40 (Case White)
  date: 1939-04-11
  end: null
  actors: [de]
  persons: [ヒトラー, カイテル]
  place: ベルリン
  summary_ja: |
    国防軍に対し、1939/40 年の作戦準備の枠組みを示した指令。ポーランドに対する
    攻撃計画「白作戦（Fall Weiss）」を、9 月 1 日以降いつでも実行できる状態に
    しておくよう命じた。この時点では英仏の介入を局地化できるという前提が置かれている。
  decisions_ja:
    - ポーランドに対する「白作戦」の作戦準備を命じる
    - 準備完了期限を 1939 年 9 月 1 日とする
    - 紛争をポーランドとの局地戦に限定する前提を置く
  license: pd
  verified: false
  sources:
    - title: List of Adolf Hitler's directives（総統指令の一覧）
      url: https://en.wikipedia.org/wiki/List_of_Adolf_Hitler%27s_directives
      note: locator。原文の所在は要確認
    - title: Case White（白作戦）
      url: https://en.wikipedia.org/wiki/Case_White

- id: dec-19390831-weisung-1
  type: directive
  name_ja: 総統指令第 1 号「戦争遂行に関する指令」
  name_en: Führer Directive No. 1 (Directive for the Conduct of the War)
  date: 1939-08-31
  end: null
  actors: [de]
  persons: [ヒトラー]
  place: ベルリン
  summary_ja: |
    ポーランド侵攻の開始を命じた指令。攻撃開始を 9 月 1 日 04:45 と定め、
    西方では英仏に対して先に手を出さず、開戦の責任を相手側に負わせる方針を示した。
    外交による解決の可能性が尽きたという判断を前提に置いている。
  decisions_ja:
    - 1939 年 9 月 1 日 04:45 をもって対ポーランド攻撃を開始する
    - 西部戦線では先に攻勢に出ず、開戦の口実を相手に作らせる
    - 海軍・空軍の行動も東方に優先させる
  license: pd
  verified: false
  sources:
    - title: List of Adolf Hitler's directives（総統指令の一覧）
      url: https://en.wikipedia.org/wiki/List_of_Adolf_Hitler%27s_directives
      note: locator。原文の所在は要確認
    - title: 1939 Invasion of Poland
      url: https://en.wikipedia.org/wiki/1939_Invasion_of_Poland

- id: dec-19391009-weisung-6
  type: directive
  name_ja: 総統指令第 6 号「西方における作戦」
  name_en: Führer Directive No. 6 (Case Yellow)
  date: 1939-10-09
  end: null
  actors: [de]
  persons: [ヒトラー]
  place: ベルリン
  summary_ja: |
    西方攻勢（黄作戦）の準備を命じた指令。オランダ・ベルギー・ルクセンブルクの
    中立を侵して北フランスへ進出し、英仏に対する航空・海上作戦の拠点を得ることを
    目的に据えた。実行はたびたび延期され、翌 1940 年 5 月の西方電撃戦に至る。
  decisions_ja:
    - 低地諸国を通過してフランス北部へ攻勢に出る準備を命じる
    - 目的をイギリスに対する航空・海上戦の前進拠点確保に置く
    - できるだけ早い時期の実行を求める（実際には翌春まで延期）
  license: pd
  verified: false
  sources:
    - title: List of Adolf Hitler's directives（総統指令の一覧）
      url: https://en.wikipedia.org/wiki/List_of_Adolf_Hitler%27s_directives
      note: locator。原文の所在は要確認
    - title: Battle of France
      url: https://en.wikipedia.org/wiki/Battle_of_France

- id: dec-19400301-weserubung
  type: directive
  name_ja: 「ヴェーザー演習作戦」指令（デンマーク・ノルウェー侵攻）
  name_en: Directive for Operation Weserübung
  date: 1940-03-01
  end: null
  actors: [de]
  persons: [ヒトラー, ファルケンホルスト]
  place: ベルリン
  summary_ja: |
    デンマークとノルウェーの占領を命じた指令。スウェーデン鉄鉱石の輸送路（ナルヴィク）
    の確保と、大西洋・北海への海空軍拠点の獲得を目的とした。英軍の同方面への
    先行行動を封じる狙いも明示されている。
  decisions_ja:
    - デンマーク・ノルウェーを占領する（ヴェーザー演習作戦）
    - 鉄鉱石輸送路と北海・大西洋への出口を確保する
    - 英仏がノルウェーに先に足場を作るのを防ぐ
  license: pd
  verified: false
  sources:
    - title: List of Adolf Hitler's directives（総統指令の一覧）
      url: https://en.wikipedia.org/wiki/List_of_Adolf_Hitler%27s_directives
      note: locator。原文の所在は要確認
    - title: Operation Weserübung
      url: https://en.wikipedia.org/wiki/Operation_Weser%C3%BCbung

- id: dec-19400716-weisung-16
  type: directive
  name_ja: 総統指令第 16 号「アシカ作戦」（英本土上陸準備）
  name_en: Führer Directive No. 16 (Operation Sea Lion)
  date: 1940-07-16
  end: null
  actors: [de]
  persons: [ヒトラー]
  place: ベルリン
  summary_ja: |
    イギリス本土上陸作戦「アシカ」の準備を命じた指令。上陸の前提条件として
    イギリス空軍の無力化を挙げており、これが同年夏のバトル・オブ・ブリテンの
    直接の根拠になった。制空権が取れなかったため上陸は実行されず、9 月に延期・
    事実上放棄される。
  decisions_ja:
    - イギリス本土への上陸作戦（アシカ作戦）の準備を命じる
    - 前提条件としてイギリス空軍の航空優勢を排除する
    - 準備完了を 8 月中旬とする
  license: pd
  verified: false
  sources:
    - title: List of Adolf Hitler's directives（総統指令の一覧）
      url: https://en.wikipedia.org/wiki/List_of_Adolf_Hitler%27s_directives
      note: locator。原文の所在は要確認
    - title: Operation Sea Lion
      url: https://en.wikipedia.org/wiki/Operation_Sea_Lion

