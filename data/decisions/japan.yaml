- id: dec-19411105-kokusaku-suikou-yoryo
  coord: [139.7528, 35.6852]
  type: imperial_conference
  name_ja: 御前会議「帝国国策遂行要領」（12 月初頭開戦を決定）
  name_en: Imperial Conference — Revised Guidelines (decision for war in early December)
  date: 1941-11-05
  end: null
  actors: [jp]
  persons: [昭和天皇, 東條英機, 東郷茂徳, 杉山元, 永野修身]
  place: 東京・宮中
  summary_ja: |
    東條内閣のもとで対米英蘭開戦を「12 月初頭」と定めた御前会議。
    甲案・乙案の 2 つの交渉案を用意し、12 月 1 日午前 0 時までに交渉が
    成立すれば武力発動を中止するという条件を付けた。同日、大海令第 1 号により
    連合艦隊に作戦準備が命じられ、軍事日程が動き出す。
  decisions_ja:
    - 武力発動の時期を 12 月初頭と定める
    - 対米交渉案として甲案・乙案を用意する
    - 12 月 1 日 0 時までに交渉成立すれば武力発動を中止する
    - 大海令第 1 号で連合艦隊に作戦準備を命じる（同日）
