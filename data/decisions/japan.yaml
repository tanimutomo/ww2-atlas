  summary_ja: |
    ハル・ノート（11 月 26 日）を受け、対米交渉の成立見込みが無くなったとして
    対米英蘭開戦を最終決定した御前会議。11 月 5 日の決定に付けられていた
    「12 月 1 日 0 時までに交渉成立なら中止」の条件が外れ、12 月 8 日の開戦が
    確定した。翌 2 日、機動部隊に「ニイタカヤマノボレ一二〇八」が発信される。
  decisions_ja:
