- id: dec-19410906-teikoku-kokusaku-suikou
  coord: [139.7528, 35.6852]
  type: imperial_conference
  name_ja: 御前会議「帝国国策遂行要領」（対米交渉の期限を切る）
  name_en: Imperial Conference — Guidelines for Implementing National Policy
  date: 1941-09-06
  end: null
  actors: [jp]
  persons: [昭和天皇, 近衛文麿, 杉山元, 永野修身]
  place: 東京・宮中
  summary_ja: |
    対米英蘭戦の準備を 10 月下旬を目途に完成させ、並行して外交交渉を続けるが、
    10 月上旬までに要求が通る見込みがなければ開戦を決意する、と定めた御前会議。
    「外交と戦争準備の並行」に初めて期限が入った決定で、以後の日程を規定した。
    天皇が統帥部に見通しを問い、永野・杉山が答えた場面が知られる。
  decisions_ja:
    - 対米英蘭戦争の準備を 10 月下旬を目途に完成する
    - 並行して対米交渉を継続する
    - 10 月上旬までに要求貫徹の見込みがなければ開戦を決意する
