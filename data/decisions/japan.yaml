- id: dec-19400927-sangoku-domei
  coord: [13.405, 52.52]
  type: treaty
  name_ja: 日独伊三国同盟条約
  name_en: Tripartite Pact
  date: 1940-09-27
  end: null
  actors: [jp, de, it]
  persons: [松岡洋右, リッベントロップ, チアノ]
  place: ベルリン
  summary_ja: |
    日本・ドイツ・イタリアが相互援助を約した条約。締約国のいずれかが
    「現に欧州戦争または日中紛争に参入していない国」から攻撃された場合に
    互いに援助すると定め、事実上アメリカを牽制する形をとった。
    日本の南方進出と対米関係悪化の枠組みを決めた条約で、以後の国策決定の前提になる。
  decisions_ja:
    - 欧州における独伊、大東亜における日本の「指導的地位」を相互に承認する
    - 締約国が第三国から攻撃された場合、相互に援助する
    - ソ連との既存の関係には影響しないと明記する
  license: pd
  verified: true
  sources:
