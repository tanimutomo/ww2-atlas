- id: dec-19400927-sangoku-domei
  coord: [13.405, 52.52]
  type: treaty
  name_ja: 日独伊三国同盟条約
  name_en: Tripartite Pact
  date: 1940-09-27
  end: null
  actors: [jp, de, it]
  persons: [松岡洋右, リッベントロップ, チアノ]
  place: ベルリン
  summary_ja: |
    日本・ドイツ・イタリアが相互援助を約した条約。締約国のいずれかが
    「現に欧州戦争または日中紛争に参入していない国」から攻撃された場合に
    互いに援助すると定め、事実上アメリカを牽制する形をとった。
    日本の南方進出と対米関係悪化の枠組みを決めた条約で、以後の国策決定の前提になる。
  decisions_ja:
    - 欧州における独伊、大東亜における日本の「指導的地位」を相互に承認する
    - 締約国が第三国から攻撃された場合、相互に援助する
    - ソ連との既存の関係には影響しないと明記する
  license: pd
  verified: false
  sources:
    - title: Tripartite Pact（条文・Wikisource ほか）
      url: https://en.wikipedia.org/wiki/Tripartite_Pact
    - title: 国立公文書館デジタルアーカイブ
      url: https://www.digital.archives.go.jp/
      note: 条約書原本の所在。請求記号の特定は未了

- id: dec-19410702-josei-no-suii
  coord: [139.7528, 35.6852]
  type: imperial_conference
  name_ja: 御前会議「情勢ノ推移ニ伴フ帝国国策要綱」
  name_en: Imperial Conference — Outline of National Policies in View of the Changing Situation
  date: 1941-07-02
  end: null
  actors: [jp]
  persons: [昭和天皇, 近衛文麿, 松岡洋右, 杉山元, 永野修身]
  place: 東京・宮中
  summary_ja: |
    独ソ開戦（6 月 22 日）を受けて日本の方針を決めた御前会議。南方進出を進める
    一方で、対ソ戦の準備も並行して整えるという二本立ての方針を採った。
    南部仏印進駐がこの決定に基づいて実行され、アメリカの対日資産凍結・
    石油禁輸を招く直接の引き金になる。
  decisions_ja:
    - 南方進出の歩を進め、対英米戦の準備を整える
    - 独ソ戦の推移が有利になれば武力による北方問題解決も行う（関特演）
    - 目的達成のため対英米戦を「避けない」
  license: pd
  verified: false
  sources:
    - title: 御前会議（一覧・経緯）
      url: https://ja.wikipedia.org/wiki/%E5%BE%A1%E5%89%8D%E4%BC%9A%E8%AD%B0
