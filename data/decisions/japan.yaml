# ★ P0 の芯（日本側）。ここから真珠湾・マレーへ authorizes が伸びる
- id: dec-19411201-gozen-kaigi-kaisen
  coord: [139.7528, 35.6852]
  type: imperial_conference
  name_ja: 御前会議（対米英蘭開戦の最終決定）
  name_en: Imperial Conference — final decision for war against the US, Britain and the Netherlands
  date: 1941-12-01
  end: null
  actors: [jp]
  persons: [昭和天皇, 東條英機, 東郷茂徳, 杉山元, 永野修身]
