  summary_ja: |
    守りきるべき最終防衛線として「絶対国防圏」（千島・小笠原・内南洋（マリアナ・
    カロリン）・西部ニューギニア・スンダ・ビルマ）を定めた御前会議。
    それまで確保するとしていた外周の要地を実質的に切り捨てる決定で、
