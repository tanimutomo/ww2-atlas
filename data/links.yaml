# 3 層をつなぐリンク。ここが手作業の核で、このサイトの独自性そのもの。
#
#   authorizes   決定 → 作戦（「なぜその侵攻をしたか」の答え）
#   triggers     出来事 → 決定（戦況が司令部を動かした）
#   responds_to  決定 → 出来事（予期・備え・対応）
#   reports      発表・報道 → 実際の戦況（discrepancy で「発表と実態」を構造化）
#
# ⚠ 全レコードと同じく未検証（レコード側 verified: false）。
#   relation の向きと根拠は note_ja に書く。断定的な因果は書かない。
#
# discrepancy の kind:
#   own_losses_understated  自軍の損害を小さく伝えた
#   enemy_losses_overstated 敵の損害を大きく伝えた
#   omitted                 都合の悪い事実を伝えなかった
#   euphemism               言い換えた
#   accurate                ほぼ実態どおり

