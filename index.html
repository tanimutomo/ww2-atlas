<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>WW2 時系列世界地図</title>
    <meta
      name="description"
      content="第二次世界大戦を、地図に出す「現場」と、年表に出す「司令部」「国内」の3層で同じ時間軸に並べて見る日本語の地図。"
    />
  </head>
  <body>
    <header id="topbar">
      <div class="brand">
        <strong>WW2 時系列世界地図</strong>
        <span class="tag">P0</span>
      </div>
      <div id="counts" class="counts"></div>
      <div id="legend" class="legend"></div>
    </header>

    <main id="stage">
      <section id="map-pane">
        <div id="map"></div>
        <div id="map-overlay">
          <div class="filters">
            <div class="filters-title">戦域</div>
            <div id="theatres" class="theatres"></div>
            <div class="key-block">
              <div class="filters-title">点の色 ＝ 陸・海・空</div>
              <div id="type-key" class="type-key"></div>
              <p class="key-note">細かい種別（侵攻・包囲・上陸など）は点を選ぶと出ます。</p>
            </div>
            <div class="key-block">
              <div class="filters-title">点の大きさ ＝ 重要度と新しさ</div>
              <div class="dot-key">
                <span class="dk"><i class="dk-now"></i>進行中</span>
                <span class="dk"><i class="dk-recent"></i>直近</span>
                <span class="dk"><i class="dk-past"></i>それ以前（痕跡）</span>
              </div>
            </div>
          </div>
          <p class="caveat">
            支配領域は OpenHistoricalMap の時点境界（四半期キーフレーム・補間なし）。
            <strong>ソ連領内の独軍占領地域と、日本占領下の中国は面が無いため塗り分けられていません。</strong>
            前線ラインも P0 では未実装です。
          </p>
        </div>
        <aside id="detail-panel" class="detail-panel" hidden>
          <div class="detail-panel-head">
            <span class="detail-panel-title">詳細</span>
            <button id="detail-close" class="detail-close" aria-label="閉じる（Esc）" title="閉じる（Esc）">×</button>
          </div>
          <div id="detail" class="detail-wrap"></div>
        </aside>
      </section>

      <aside id="side">
        <div class="feed-head">
          <span class="feed-title">タイムライン</span>
          <span class="feed-legend">
            <span class="key kind-field">現場</span>
            <span class="key kind-command">司令部</span>
            <span class="key kind-home">国内</span>
          </span>
        </div>
        <div id="list" class="list"></div>
      </aside>
    </main>

    <footer id="timeline">
      <div class="tl-row">
        <div class="stepper">
          <button id="prev-day" class="nav" title="前の出来事へ（←）">◀</button>
          <button id="next-day" class="nav" title="次の出来事へ（→）">▶</button>
        </div>
        <button id="play" class="play">▶ 再生</button>
        <div id="steps" class="steps"></div>
        <div id="dwells" class="steps dwells"></div>
        <div class="date-block">
          <span id="date-label" class="date-label"></span>
          <span id="day-count" class="day-count"></span>
        </div>
        <div id="chapters" class="chapters"></div>
      </div>
      <div id="density" class="density"></div>
      <input id="scrub" type="range" step="1" />
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
